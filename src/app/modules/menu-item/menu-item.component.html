<app-breadcrumb [items]="breadcrumbItems" [pageTitle]="title"></app-breadcrumb>

<div fxLayout="row" fxLayoutAlign="end center" style="margin-bottom: 16px;">
  <button (click)="openCreateDialog()" class="btn-create" mat-raised-button>
    <mat-icon>add</mat-icon>
    CREATE
  </button>
</div>

<div class="table-content-wrapper-container mat-elevation-z8">
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" class="app-table"
           matSort matSortActive="registrationDate" matSortDisableClear matSortDirection="desc"
    >
      <!-- Number Column -->
      <ng-container matColumnDef="number">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let row; let i = index">{{ i + 1 }}</td>
      </ng-container>

      <!-- Title Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <!-- Icon Column -->
      <ng-container matColumnDef="icon">
        <th mat-header-cell *matHeaderCellDef>Icon</th>
        <td mat-cell *matCellDef="let row">
          <div class="icon-display">
            <mat-icon class="icon-preview">{{ row.icon }}</mat-icon>
            <span class="icon-name">{{ row.icon }}</span>
          </div>
        </td>
      </ng-container>

      <!-- URL Column -->
      <ng-container matColumnDef="url">
        <th mat-header-cell *matHeaderCellDef>URL</th>
        <td mat-cell *matCellDef="let row">{{ row.url }}</td>
      </ng-container>

      <!-- Sort Order Column -->
      <ng-container matColumnDef="sortOrder">
        <th mat-header-cell *matHeaderCellDef>Sort Order</th>
        <td mat-cell *matCellDef="let row">{{ row.sortOrder }}</td>
      </ng-container>

      <!-- Menu Group Column -->
      <ng-container matColumnDef="menuGroup">
        <th mat-header-cell *matHeaderCellDef>Menu Group</th>
        <td mat-cell *matCellDef="let row">{{ row.menuGroup.name }}</td>
      </ng-container>

      <!-- Permission Group Column -->
      <ng-container matColumnDef="authority">
        <th mat-header-cell *matHeaderCellDef>Permission</th>
        <td mat-cell *matCellDef="let row">{{ row.authority.resource | uppercase}} - ({{row.authority.name}})</td>
      </ng-container>

      <!-- Action Column -->
      <ng-container matColumnDef="actions">
        <th *matHeaderCellDef mat-header-cell>Action</th>
        <td *matCellDef="let row" mat-cell>
          <button mat-icon-button matTooltip="Edit" matTooltipPosition="left" (click)="openEditDialog(row)" class="action-btn-update">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete" matTooltipPosition="left" (click)="openDeleteDialog(row.uuid)" class="action-btn-delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <mat-paginator
    (page)="pageChanged($event)"
    [length]="totalRecords"
    [pageSizeOptions]="pageSizeOptions"
    aria-label="Select page of search results">
  </mat-paginator>
</div>

<!--delete user dialog template-->
<ng-template #deleteDialog>
  <mat-dialog-content>
    <h3>Are you sure you want to delete this user?</h3>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>NO</button>
    <button (click)="delete()" mat-button>YES</button>
  </mat-dialog-actions>
</ng-template>
