<div class="notifier-container">
  <div class="notifier-header">
    <span class="notifier-type">{{data.type | uppercase}}</span>
  </div>
  <div class="notifier-message">
    {{data.message}}
  </div>
  <div class="notifier-actions">
    <button class="notifier-btn" (click)="snackBarRef.dismiss()">{{data.buttonText}}</button>
  </div>
</div>
