<app-breadcrumb [items]="breadcrumbItems" [pageTitle]="title"></app-breadcrumb>

<div fxLayout="row" fxLayoutAlign="space-between center" style="margin-bottom: 16px;">
  <div *ngIf="selectedNode" class="selected-node-info">
    <mat-icon>check_circle</mat-icon>
    <span>Selected: {{ selectedNode.name }}</span>
    <button mat-icon-button
            (click)="selectedNode = null"
            matTooltip="Clear selection">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div *ngIf="!selectedNode"></div>

  <div fxLayoutGap="8px">
    <button mat-raised-button
            class="btn-create"
            (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      CREATE
    </button>
    <button mat-raised-button
            class="btn-update"
            *ngIf="selectedNode"
            (click)="openEditDialog()">
      <mat-icon>edit</mat-icon>
      UPDATE
    </button>
    <button mat-raised-button
            class="btn-delete"
            *ngIf="selectedNode"
            (click)="openDeleteDialog(selectedNode.id)">
      <mat-icon>delete</mat-icon>
      DELETE
    </button>
  </div>
</div>

<mat-form-field appearance="outline" style="width: 100%;">
  <mat-label>Filter organisation units</mat-label>
  <input #input
         (keyup)="applyFilter($event)"
         autocomplete="off"
         matInput
         placeholder="Search by name, code, or other names..."/>
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<div class="mat-elevation-z8 tree-wrapper">
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="ou-tree">
    <!-- Leaf node -->
    <mat-tree-node
      (click)="onNodeClick(node)"
      *matTreeNodeDef="let node"
      [class.selected]="node === selectedNode"
      class="tree-node-item"
    >
      <span class="node-text">{{ node.name }} ({{ node.code }})</span>
      <span class="node-other-names" *ngIf="node.otherNames">- {{ node.otherNames }}</span>
    </mat-tree-node>

    <!-- Expandable node -->
    <mat-nested-tree-node *matTreeNodeDef="let node; when: hasNestedChild">
      <div class="mat-tree-node tree-node-item" [class.selected]="node === selectedNode">
        <button
          (click)="onNodeExpand(node); $event.stopPropagation()"
          [attr.aria-label]="'Toggle ' + node.name"
          mat-icon-button
        >
          <mat-icon class="mat-icon-rtl-mirror">
            {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
          </mat-icon>
        </button>
        <span (click)="onNodeClick(node)" class="node-text clickable">
          {{ node.name }} ({{ node.code }})
        </span>
        <span class="node-other-names" *ngIf="node.otherNames">- {{ node.otherNames }}</span>
      </div>
      <div
        *ngIf="treeControl.isExpanded(node)"
        [class.ou-tree-invisible]="!treeControl.isExpanded(node)"
        role="group"
      >
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
    </mat-nested-tree-node>
  </mat-tree>
</div>

<app-confirm-dialog
  [open]="isConfirmDeleteDialogOpen"
  [title]="'Delete Organisation Unit'"
  [message]="'Are you sure you want to delete this organisation unit? This action cannot be undone.'"
  (onClose)="closeConfirmDialog()"
  (onConfirm)="handleConfirmDelete()"
/>
