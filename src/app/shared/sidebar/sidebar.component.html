<div class="sidebar">
  <!-- Logo Section -->
  <div class="sidebar-header">
    <div class="logo-container" (click)="navigateToDashboard()">
      <img src="./assets/smz_logo.png" alt="Logo" class="logo-img" />
      <span class="logo-text">Zan-AfyaMaoni</span>
    </div>
  </div>

  <!-- User Info Section -->
  <div class="user-info">
    <div class="user-avatar">
      <mat-icon>account_circle</mat-icon>
    </div>
    <div class="user-details">
      <span class="user-name">{{ loggedInAs }}</span>
      <span class="user-location">
        <mat-icon>location_on</mat-icon>
        {{ organisationUnit }}
      </span>
    </div>
  </div>

  <mat-divider class="section-divider"></mat-divider>

  <!-- Navigation Menu -->
  <nav class="nav-menu">
    <mat-nav-list>
      <ng-container *ngFor="let item of menus">
        <!-- Menu items with children (expandable) -->
        <ng-container *ngIf="item.children && item.children.length > 0">
          <mat-accordion class="menu-accordion">
            <mat-expansion-panel class="menu-panel">
              <mat-expansion-panel-header class="menu-header">
                <mat-panel-title class="menu-title">
                  <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
                  <span class="menu-text">{{ item.name }}</span>
                </mat-panel-title>
              </mat-expansion-panel-header>

              <div class="submenu">
                <a *ngFor="let child of item.children"
                   class="submenu-item"
                   routerLink="{{ '/' + child.url }}"
                   routerLinkActive="active">
                  <mat-icon class="submenu-icon">{{ child.icon }}</mat-icon>
                  <span class="submenu-text">{{ child.name }}</span>
                </a>
              </div>
            </mat-expansion-panel>
          </mat-accordion>
        </ng-container>

        <!-- Menu items without children (direct links) -->
        <ng-container *ngIf="!item.children || item.children.length === 0">
          <a class="menu-item"
             routerLink="{{ '/' + item.url }}"
             routerLinkActive="active">
            <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
            <span class="menu-text">{{ item.name }}</span>
          </a>
        </ng-container>
      </ng-container>
    </mat-nav-list>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <mat-divider class="section-divider"></mat-divider>
    <span class="version-text">v1.0.0</span>
  </div>
</div>
